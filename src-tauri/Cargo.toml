[package]
name = "typing-test-app"
version = "0.1.0"
description = "Crash-resistant offline typing test desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-log = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
rand = "0.8"
once_cell = "1.19"

# bundled sqlite -> no system libsqlite3 dependency, one less thing that can
# fail to load at runtime and crash the app on a user's machine.

[profile.release]
panic = "unwind"
# NOTE: deliberately NOT "abort". Combined with catch_unwind around every
# Tauri command handler (see src/main.rs), a panic inside one command
# unwinds and returns an error to the frontend instead of killing the process.
